<nav class="sb" aria-label="Navegação principal">
  <!-- 1. Logo -->
  <div class="sb__logo">
    <span class="sb__logo-mark">
      <img class="sb__logo-image" src="./images/logo.png" alt="Rollout Service" />
    </span>
  </div>

  <!-- Navegação -->
  <div class="sb__nav">
    @for (link of topLinks; track link.route) {
    <a class="sb-item" [routerLink]="link.route" routerLinkActive="sb-item--active">
      <app-icon class="sb-item__icon" [name]="link.icon" [size]="20" />
      <span class="sb-item__label">{{ link.label }}</span>
    </a>
    }

    <!-- Rollouts: flyout à direita (fora do sidebar) -->
    <div class="sb-group" [class.sb-group--open]="rolloutOpen()">
      <button type="button" class="sb-item sb-item--btn" [class.sb-item--active]="rolloutActive()"
        (click)="toggleRollout()" aria-haspopup="true" [attr.aria-expanded]="rolloutOpen()">
        <app-icon class="sb-item__icon" name="layout-dashboard" [size]="20" />
        <span class="sb-item__label">Rollouts</span>

      </button>

      <div class="sb-flyout" (mouseleave)="closeRollout()">
        <span class="sb-flyout__title">Rollouts</span>
        @for (link of rolloutLinks; track link.route) {
        <a class="sb-flyout__link" [routerLink]="link.route" routerLinkActive="sb-flyout__link--active"
          (click)="closeRollout()">
          <span>{{ link.label }}</span>
        </a>
        }
      </div>
    </div>

    @for (link of bottomLinks; track link.route) {
    <a class="sb-item" [routerLink]="link.route" routerLinkActive="sb-item--active">
      <app-icon class="sb-item__icon" [name]="link.icon" [size]="20" />
      <span class="sb-item__label">{{ link.label }}</span>
    </a>
    }
  </div>

  <!-- Rodapé: usuário + Sair -->
  <div class="sb__footer">
    <div class="sb__user">
      <app-user-avatar />
    </div>
    <button pButton type="button" text severity="secondary" class="sb__logout" aria-label="Sair" (click)="logout()">
      <app-icon name="arrow-right-from-line" [size]="20" />
      <!-- <lucide-icon name="arrow-right-from-line"></lucide-icon> -->
    </button>
  </div>
</nav>
