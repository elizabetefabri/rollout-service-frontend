<section class="dash">
  <h1 class="dash__title">Dashboard</h1>

  <div
    class="backend-status"
    [class.backend-status--online]="backendStatus() === 'online'"
    [class.backend-status--offline]="backendStatus() === 'offline'"
  >
    @switch (backendStatus()) {
      @case ('checking') {
        <span>Conectando ao backend…</span>
      }
      @case ('online') {
        <span>Backend conectado</span>
      }
      @case ('offline') {
        <span>Backend indisponível — confira INTEGRACAO-BACKEND.md</span>
      }
    }
  </div>
</section>
